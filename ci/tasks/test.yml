platform: linux

image_resource:
  type: registry-image
  source:
    repository: python
    # Pinned to match prod and what uv.lock resolved against -- unpinned,
    # uv drifts to the newest CPython (3.14 as of 2026-09), which has no
    # matching cbor2 wheel and falls back to a source build that fails
    # without a Rust toolchain in the image. Using this exact image (not
    # a generic base + uv-managed interpreter) makes the pin structural
    # rather than a flag someone can forget to pass.
    tag: "3.13-slim"

inputs:
  - name: repo

# SSH_KEY/KNOWN_HOSTS: read-only, only used to `git clone` standards over SSH
# so doctrine-grep.sh runs against the real, current rules and so
# gh-app-token.sh is available before `uv sync` needs it. Same creds every
# deploy task carries. APP_ID/PRIVATE_KEY: mints a token scoped to synthlib
# alone (synthlib plan, Phase 5) -- same App credential every pipeline's
# git-dev resource already trusts, not a new one.
params:
  SSH_KEY: ((saya_ssh_key))
  KNOWN_HOSTS: ((saya_known_hosts))
  APP_ID: ((github_app_id))
  PRIVATE_KEY: ((github_app_private_key))
  INSTALLATION_ID: "159078769"

run:
  path: sh
  args:
    - -ec
    - |
      cd repo
      sh ci/test.sh
