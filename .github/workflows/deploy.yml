name: Deploy to OrbStack

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The test job spins up fixed-name containers on fixed ports (see below), so
# two runs of this workflow at once would have one `docker rm -f` the other's
# database mid-test. Serialise per repo rather than per ref: a PR run and a
# main run collide exactly as hard as two main runs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DEBUG: False
  ALLOWED_HOSTS: "questlog.synthrack.studio,questlog.omnyist.com,questlog-server,saya,localhost"
  CSRF_TRUSTED_ORIGINS: "https://questlog.synthrack.studio,https://questlog.omnyist.com"
  DATABASE_URL: postgresql://questlog:questlog@synthcore-postgres:5432/questlog
  REDIS_URL: redis://synthcore-redis:6379/2

jobs:
  test:
    runs-on: self-hosted
    # Self-hosted runner is macOS — GH Actions `services:` are Linux-only, so
    # spin throwaway Postgres/Redis via `docker run` (OrbStack) instead.
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        # Pin to prod's Python (python:3.13-slim) and what uv.lock resolved
        # against. Unpinned, the runner drifts to the newest CPython (3.14),
        # which has no matching cbor2 wheel and falls back to a source build
        # that fails on the runner's Rust toolchain.
        python-version: "3.13"

    - name: Start test services
      run: |
        # `docker rm -fv`, not `docker rm -f`. The postgres image declares an
        # anonymous VOLUME, so removing the container without -v leaves its data
        # directory behind -- roughly 65 MB abandoned on the runner per CI run. By
        # 2026-08-30 Saya held 288 of them, about 18 GB, and nothing pointed at the
        # cause because each individual run looked like it cleaned up after itself.
        docker rm -fv questlog-ci-pg questlog-ci-redis 2>/dev/null || true
        docker run -d --name questlog-ci-pg \
          -e POSTGRES_DB=questlog -e POSTGRES_USER=questlog -e POSTGRES_PASSWORD=questlog \
          -p 5439:5432 postgres:16
        docker run -d --name questlog-ci-redis -p 6399:6379 redis:alpine
        timeout 60 sh -c 'until docker exec questlog-ci-pg pg_isready -U questlog; do sleep 1; done'

    - name: Run tests
      env:
        DATABASE_URL: postgresql://questlog:questlog@localhost:5439/questlog
        REDIS_URL: redis://localhost:6399/0
      run: uv run --group dev pytest -q

    - name: Stop test services
      if: always()
      run: docker rm -fv questlog-ci-pg questlog-ci-redis 2>/dev/null || true

  deploy:
    needs: test
    runs-on: self-hosted
    # Never on a pull request. PRs get a verdict from the checks above; only
    # a push to main is allowed to reach production.
    if: github.event_name == 'push'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 10

    - name: Create production .env file
      run: |
        cat > .env << EOF
        DEBUG=${{ env.DEBUG }}
        SECRET_KEY=${{ secrets.SECRET_KEY }}
        ALLOWED_HOSTS=${{ env.ALLOWED_HOSTS }}
        CSRF_TRUSTED_ORIGINS=${{ env.CSRF_TRUSTED_ORIGINS }}
        DATABASE_URL=${{ env.DATABASE_URL }}
        REDIS_URL=${{ env.REDIS_URL }}
        TWITCH_CLIENT_ID=${{ vars.TWITCH_CLIENT_ID }}
        TWITCH_CLIENT_SECRET=${{ secrets.TWITCH_CLIENT_SECRET }}
        BUNGIE_API_KEY=${{ secrets.BUNGIE_API_KEY }}
        STEAM_API_KEY=${{ secrets.STEAM_API_KEY }}
        STEAM_ID=${{ vars.STEAM_ID }}
        WARFRAME_ACCOUNT_ID=${{ secrets.WARFRAME_ACCOUNT_ID }}
        WARFRAME_PLATFORM=pc
        API_KEY=${{ secrets.API_KEY }}
        SENTRY_DSN=${{ secrets.SENTRY_DSN }}
        EOF

    - name: Deploy containers
      run: |
        docker compose -f docker-compose.prod.yml up --build -d --remove-orphans

    - name: Verify the containers are actually running
      run: |
        # Thirty seconds. The longest boot chain here is the server's
        # `migrate` then daphne; a container that is going to die on a bad
        # setting has done it well inside that, and a restart loop has had
        # time to be visible as one.
        sleep 30

        ids=$(docker compose -f docker-compose.prod.yml ps -aq)
        if [ -z "$ids" ]; then
          # An empty list here is not "nothing is wrong", it is "this check
          # could not see what it is meant to verify" — the same shape as a
          # search that returns nothing because it failed to run.
          echo "No containers found for this compose project."
          exit 1
        fi

        failed=""
        for cid in $ids; do
          info=$(docker inspect --format '{{.Name}} {{.State.Status}} {{.State.ExitCode}}' "$cid")
          name=$(echo "$info" | cut -d' ' -f1 | sed 's|^/||')
          state=$(echo "$info" | cut -d' ' -f2)
          code=$(echo "$info" | cut -d' ' -f3)
          case "$state" in
            running|created)
              echo "ok: $name ($state)"
              ;;
            exited)
              # A one-shot that finished its job is not a failure. Read from
              # the exit code rather than from a list of service names:
              # frontend-build is the only one today, and an enumerated list
              # is a promise to remember the next one.
              if [ "$code" = "0" ]; then
                echo "ok: $name (exited 0, one-shot)"
              else
                echo "FAILED: $name exited $code"
                failed="$failed $name"
              fi
              ;;
            *)
              # restarting, dead, paused — all of them mean this container is
              # not doing its job right now.
              echo "FAILED: $name is $state"
              failed="$failed $name"
              ;;
          esac
        done

        if [ -n "$failed" ]; then
          for name in $failed; do
            echo "----- $name: last 30 log lines -----"
            docker logs --tail 30 "$name" 2>&1 || true
          done
          echo "Deploy verification failed:$failed"
          exit 1
        fi

    - name: Wait for services to be ready
      run: |
        timeout 60 sh -c 'until docker exec synthcore-postgres pg_isready -U questlog -d questlog; do sleep 1; done'
        sleep 5

    - name: Collect static files
      run: |
        docker compose -f docker-compose.prod.yml exec -T server uv run python manage.py collectstatic --noinput

    - name: Clean up old Docker images
      run: |
        docker image prune -f
