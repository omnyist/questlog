services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - gh_token
    container_name: questlog-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://questlog:questlog@synthcore-pgbouncer:6432/questlog
      - REDIS_URL=redis://synthcore-redis:6379/2
    ports:
      - "7176:7176"
    networks:
      - default
      - synth
    command: >
      sh -c "uv run python manage.py migrate &&
             uv run daphne -b 0.0.0.0 -p 7176 --application-close-timeout 60 config.asgi:application"

  # Two containers, not one, and not the single celery worker they replace.
  #
  # Cadences here span two orders of magnitude -- 300s against daily and weekly
  # -- and a heartbeat threshold is per worker. One container would have one
  # identity and therefore one number, so a dead weekly sync would be invisible
  # for six days behind a healthy poller. Two also means `docker ps` tells the
  # truth about both, since Docker's restart machinery sees one lifecycle per
  # container.
  #
  # Cost, measured 2026-08-28: questlog-celery was 715 MiB against a 105 MiB
  # Django process -- a prefork pool running 194 tasks a day. These are ~100 MiB
  # each.
  warframe:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - gh_token
    container_name: questlog-warframe
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://questlog:questlog@synthcore-pgbouncer:6432/questlog
      - REDIS_URL=redis://synthcore-redis:6379/2
    networks:
      - default
      - synth
    command: uv run python manage.py poll_steam_warframe --loop

  warframe-upkeep:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - gh_token
    container_name: questlog-warframe-upkeep
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://questlog:questlog@synthcore-pgbouncer:6432/questlog
      - REDIS_URL=redis://synthcore-redis:6379/2
    networks:
      - default
      - synth
    command: uv run python manage.py warframe_upkeep --loop

networks:
  default:
  synth:
    external: true

secrets:
  # Sourced from the shell environment on the SSH invocation that runs
  # `docker compose build` (ci/deploy.sh), never from .env -- env_file above
  # already wires every service's runtime environment, and a token placed
  # there would be readable via `docker inspect` indefinitely, not just
  # present during the build.
  gh_token:
    environment: GH_TOKEN

